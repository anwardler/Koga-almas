<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کۆگای ئەلماس | ALMAS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#202638;font-family:Tahoma,Arial,sans-serif}
header{background:#111;color:#fff;text-align:center;padding:30px 15px;border-bottom:4px solid #d9ad4c}
.logo{font-size:42px;color:#e8bd55}
header h1{color:#e8bd55;margin:8px}
header p{font-size:13px}
main{max-width:950px;margin:auto;padding:18px}
.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:25px;font-size:16px}
h2{font-size:20px}
.categories{display:flex;gap:8px;overflow:auto;margin:15px 0}
.categories button{padding:12px;border:0;border-radius:15px;background:#fff;white-space:nowrap}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border-radius:17px;overflow:hidden;border:1px solid #ddd}
.photo{background:#18243a;color:#e8bd55;text-align:center;padding:25px;font-size:40px}
.info{padding:12px}
.info h3{font-size:15px}
button{cursor:pointer}
.add{background:#29486f;color:white;border:0;border-radius:10px;padding:11px;width:100%}
.panel{background:white;padding:15px;border-radius:16px;margin-top:20px}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.send{display:block;background:#16834b;color:white;text-align:center;padding:14px;border-radius:12px;text-decoration:none;margin-top:12px}
.cartrow{padding:10px;border-bottom:1px solid #ddd}
footer{text-align:center;padding:25px;color:#777}
@media(min-width:650px){.products{grid-template-columns:repeat(3,1fr)}}
@media print{header,.search,.categories,.add,.send,.no-print{display:none}.panel{display:block}}
</style>
</head>
<body>

<header>
<div class="logo">💎</div>
<h1>ئەلماس | ALMAS</h1>
<p>کۆگای کەلوپەلی مارکێت</p>
<p>ناو هەولێر و دەوروبەری</p>
</header>

<main>
<h2>بەخێربێیت بۆ کۆگای ئەلماس</h2>
<input class="search" id="search" placeholder="گەڕان بەدوای کاڵاکان...">

<h2>بەشەکانی کاڵا</h2>
<div class="categories">
<button onclick="filter('هەموو')">هەموو</button>
<button onclick="filter('خواردنەوە')">🥤 خواردنەوە</button>
<button onclick="filter('چیپس')">🍟 چیپس</button>
<button onclick="filter('پاککەرەوە')">🧴 پاککەرەوە</button>
<button onclick="filter('خواردەمەنی')">🥫 خواردەمەنی</button>
</div>

<h2>کاڵاکان</h2>
<div class="products" id="products"></div>

<div class="panel">
<h2>🛒 سەبەتەی داواکاری</h2>
<div id="cart"></div>
<input id="customer" placeholder="ناوی دووکان / کڕیار">
<input id="phone" placeholder="ژمارەی مۆبایل">
<textarea id="note" placeholder="تێبینی"></textarea>
<a class="send" id="send" href="#" target="_blank">ناردنی داواکاری بۆ واتساپ</a>
<button class="add no-print" onclick="window.print()" style="margin-top:10px">🖨️ پرێنت</button>
</div>
</main>

<footer>💎 کۆگای ئەلماس ALMAS</footer>

<script>
const products=[
{id:1,name:"ئاوی خواردنەوە",cat:"خواردنەوە",icon:"💧"},
{id:2,name:"خواردنەوەی گازی",cat:"خواردنەوە",icon:"🥤"},
{id:3,name:"شەربەت",cat:"خواردنەوە",icon:"🧃"},
{id:4,name:"چیپس",cat:"چیپس",icon:"🍟"},
{id:5,name:"بسکویت",cat:"چیپس",icon:"🍪"},
{id:6,name:"شامپۆ",cat:"پاککەرەوە",icon:"🧴"},
{id:7,name:"سابوون",cat:"پاککەرەوە",icon:"🧼"},
{id:8,name:"کۆنسەرڤ",cat:"خواردەمەنی",icon:"🥫"},
{id:9,name:"زەیت",cat:"خواردەمەنی",icon:"🫙"},
{id:10,name:"شیرینی",cat:"خواردەمەنی",icon:"🍫"}
];

let quantities={};
let category="هەموو";

function render(){
let search=document.getElementById("search").value.toLowerCase();
let area=document.getElementById("products");
area.innerHTML="";

products.filter(p=>
(category==="هەموو"||p.cat===category)&&
p.name.toLowerCase().includes(search)
).forEach(p=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`
<div class="photo">${p.icon}</div>
<div class="info">
<h3>${p.name}</h3>
<p>نرخ: شاراوە</p>
<button class="add" onclick="change(${p.id},1)">＋ زیادکردن</button>
<p>ژمارە: ${quantities[p.id]||0}</p>
<button onclick="change(${p.id},-1)">−</button>
</div>`;
area.appendChild(div);
});
}

function change(id,num){
quantities[id]=(quantities[id]||0)+num;
if(quantities[id]<=0)delete quantities[id];
render();
renderCart();
}

function filter(cat){
category=cat;
render();
}

function renderCart(){
let box=document.getElementById("cart");
let selected=products.filter(p=>quantities[p.id]);
box.innerHTML=selected.length?"":"هیچ کاڵایەک هەڵنەبژێردراوە";
selected.forEach(p=>{
box.innerHTML+=`<div class="cartrow">${p.name} — ${quantities[p.id]} دانە</div>`;
});
updateLink();
}

function updateLink(){
let message="داواکاری نوێ - کۆگای ئەلماس%0A";
message+="ناو: "+encodeURIComponent(document.getElementById("customer").value)+"%0A";
message+="مۆبایل: "+encodeURIComponent(document.getElementById("phone").value)+"%0A%0A";

products.filter(p=>quantities[p.id]).forEach(p=>{
message+=encodeURIComponent(p.name)+" × "+quantities[p.id]+"%0A";
});

message+="%0Aتێبینی: "+encodeURIComponent(document.getElementById("note").value);
document.getElementById("send").href="https://wa.me/9647512267252?text="+message;
}

document.getElementById("search").addEventListener("input",render);
["customer","phone","note"].forEach(id=>{
document.getElementById(id).addEventListener("input",updateLink);
});

render();
renderCart();
</script>
</body>
</html>
